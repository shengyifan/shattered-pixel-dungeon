plugins { id 'java-library' }
java.sourceCompatibility = java.targetCompatibility = appJavaCompatibility
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
dependencies {
    api project(':control-protocol')
    implementation project(':core')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'junit:junit:4.13.2'
    // The native WndGuess fixture supplies a no-font PlatformSupport implementation.
    testImplementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
test {
    useJUnitPlatform()
    // Desktop/app packages already include these resources. Unit tests need the
    // same immutable dictionary on their classpath, without a production path fallback.
    classpath += files(project(':core').file('src/main/assets'))
    jvmArgs '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED'
}

tasks.register('generateUiCoverage', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.shatteredpixel.shatteredpixeldungeon.control.game.UiCoverageInventory'
    args rootProject.projectDir.absolutePath
}

// A new String-producing display operation must be reviewed before tests can pass.
tasks.register('checkTextSources', Exec) {
    dependsOn classes
    def classpathFile = layout.buildDirectory.file('text-provenance/source-classpath.txt')
    def reportFile = layout.buildDirectory.file('text-provenance/composition-coverage.json')
    doFirst {
        classpathFile.get().asFile.parentFile.mkdirs()
        classpathFile.get().asFile.text = sourceSets.main.runtimeClasspath.asPath
        commandLine 'python3', file('src/test/python/text_composition_inventory.py').absolutePath,
                '--root', rootProject.projectDir.absolutePath,
                '--classpath-file', classpathFile.get().asFile.absolutePath,
                '--output', reportFile.get().asFile.absolutePath
    }
}
test.dependsOn tasks.named('checkTextSources')
